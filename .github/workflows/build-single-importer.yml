name: Build single-file importer

# Regenerate gltf_importer.py whenever the single-file builder changes.
on:
  push:
    branches:
      - perf/bulk-mesh-import
    paths:
      - tools/build_single_file.py
      - .github/workflows/build-single-importer.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/bulk-mesh-import
          fetch-depth: 0

      - name: Build single-file importer
        run: python tools/build_single_file.py

      - name: Syntax check
        run: python -m py_compile gltf_importer.py

      - name: Commit generated importer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gltf_importer.py
          if ! git diff --cached --quiet; then
            git commit -m "Build single-file fast GLTF importer"
            git push origin HEAD:perf/bulk-mesh-import
          fi
